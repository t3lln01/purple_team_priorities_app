kind = "api"
previewPath = "/api"
title = "Python API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd ../.. && uv run python artifacts/purple-team-dashboard/django/serve.py"

[services.env]
PORT = "8080"

[services.production]
build = "uv sync --no-dev && uv run python artifacts/purple-team-dashboard/django/manage.py collectstatic --noinput"

[services.production.run]
args = ["uv", "run", "--no-sync", "python", "artifacts/purple-team-dashboard/django/serve.py"]

[services.production.run.env]
PORT = "8080"
DJANGO_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
