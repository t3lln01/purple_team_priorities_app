kind = "web"
previewPath = "/"
title = "Purple Team Adversary Prioritization"
version = "1.0.0"
id = "artifacts/purple-team-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 19199
name = "web"
paths = ["/"]

[services.development]
run = "cd ../.. && uv run python artifacts/purple-team-dashboard/django/serve.py"

[services.env]
PORT = "19199"
BASE_PATH = "/"

[services.production]
build = "uv sync --no-dev && uv run python artifacts/purple-team-dashboard/django/manage.py collectstatic --noinput"

[services.production.run]
args = ["uv", "run", "--no-sync", "python", "artifacts/purple-team-dashboard/django/serve.py"]

[services.production.run.env]
PORT = "19199"
DJANGO_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
